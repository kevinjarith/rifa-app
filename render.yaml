services:
  - type: web
    name: rifa-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rifa-app-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_SEED
        value: 'false'
      - key: COOKIE_SECURE
        value: 'true'

databases:
  - name: rifa-app-db
    plan: free
