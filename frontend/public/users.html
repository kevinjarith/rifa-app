<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usuarios — Rifa</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/users.css" />
</head>
<body>
<div class="layout">
  <header class="topbar" id="topbar-root"></header>
  <main>
    <div id="guard" class="page-guard" hidden>Esta sección es solo para el SUPER_ADMIN.</div>
    <div id="users-content" hidden>
      <div class="users-toolbar">
        <h2>Usuarios</h2>
        <button class="btn btn-primary" id="new-user-btn">Nuevo usuario</button>
      </div>
      <p class="users-count" id="users-count"></p>
      <div class="card table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th>Acciones</th></tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<dialog class="modal" id="user-modal"></dialog>

<script src="js/api.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/utils/confirm.js"></script>
<script src="js/nav.js"></script>
<script src="js/users.js"></script>
</body>
</html>
